services:
  metrics-cron:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shopizer-metrics-scheduler:latest
    env_file:
      - ../tracing.env
      - .env
    environment:
      METRICS_SQL_FILE: "${METRICS_SQL_FILE:-/workspace/metrics_scripts.sql}"
      METRICS_OUTPUT_DIR: "${METRICS_OUTPUT_DIR:-/app/results}"
      METRICS_OPERATIONAL_CRON: "${METRICS_OPERATIONAL_CRON:-*/15 * * * *}"
      METRICS_BUSINESS_CRON: "${METRICS_BUSINESS_CRON:-*/30 * * * *}"
      METRICS_BEHAVIORAL_CRON: "${METRICS_BEHAVIORAL_CRON:-0 */2 * * *}"
      METRICS_DAILY_REPORTING_CRON: "${METRICS_DAILY_REPORTING_CRON:-0 */6 * * *}"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp/bigquery-service-account.json
      METRICS_WAREHOUSES: "${METRICS_WAREHOUSES:-}"
      METRICS_SNOWFLAKE_WAREHOUSE: "${METRICS_SNOWFLAKE_WAREHOUSE:-ANALYTICS_WH}"
      METRICS_SNOWFLAKE_QUERY_TAG: "${METRICS_SNOWFLAKE_QUERY_TAG:-}"
      METRICS_SNOWFLAKE_RAW_EVENTS_ONLY: "${METRICS_SNOWFLAKE_RAW_EVENTS_ONLY:-false}"
      METRICS_SNOWFLAKE_RAW_EVENTS_COMPARE: "${METRICS_SNOWFLAKE_RAW_EVENTS_COMPARE:-false}"
      METRICS_SNOWFLAKE_RAW_EVENTS_FAIL_ON_MISMATCH: "${METRICS_SNOWFLAKE_RAW_EVENTS_FAIL_ON_MISMATCH:-true}"
      METRICS_SNOWFLAKE_OPERATIONAL_EVENTS_TABLE: "${METRICS_SNOWFLAKE_OPERATIONAL_EVENTS_TABLE:-OPERATIONAL_EVENTS}"
      METRICS_SNOWFLAKE_RAW_EVENTS_CTE_FILE: "${METRICS_SNOWFLAKE_RAW_EVENTS_CTE_FILE:-/workspace/metrics-scheduler/snowflake_raw_event_state.sql}"
      METRICS_IMMUTABLE_BACKFILL_ENABLED: "${METRICS_IMMUTABLE_BACKFILL_ENABLED:-true}"
      METRICS_IMMUTABLE_BACKFILL_TABLES: "${METRICS_IMMUTABLE_BACKFILL_TABLES:-CUSTOMER,PRODUCT,PRODUCT_DESCRIPTION,PRODUCT_AVAILABILITY,PRODUCT_PRICE}"
      METRICS_IMMUTABLE_BACKFILL_FORCE: "${METRICS_IMMUTABLE_BACKFILL_FORCE:-false}"
      METRICS_IMMUTABLE_BACKFILL_WAIT_SECONDS: "${METRICS_IMMUTABLE_BACKFILL_WAIT_SECONDS:-120}"
      METRICS_MYSQL_DSN: "${METRICS_MYSQL_DSN:-}"
      SNOWFLAKE_PRIVATE_KEY_PATH: "${SNOWFLAKE_PRIVATE_KEY_PATH:-/secrets/snowflake/ecomm_sf_key/ecomm_sf_key_api_user1.p8}"
      SHOPIZER_REPO_ROOT: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - shopizer
    volumes:
      - ..:/workspace:ro
      - ./results:/app/results
      - ../secrets/ecomm_sf_key/gcp/bigquery-service-account.json:/secrets/gcp/bigquery-service-account.json:ro
      - ${SNOWFLAKE_PRIVATE_KEY_MOUNT_SOURCE:-../secrets/ecomm_sf_key/ecomm_sf_key_api_user1.p8}:/secrets/snowflake/ecomm_sf_key/ecomm_sf_key_api_user1.p8:ro
    command: ["cron"]
    restart: unless-stopped

networks:
  shopizer:
    name: ${SHOPIZER_NETWORK_NAME:-shopizer_default}
    external: true
