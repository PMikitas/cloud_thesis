##
#configuration connection pool
##
# Sized for Gatling load tests (10+ concurrent VUs, each issuing multiple
# parallel JPA queries per checkout). At pool size 4 the pool was exhausting
# during checkout transactions and requests were timing out after 30s,
# surfacing as "Connection is not available" → checkout 503 + spurious
# "EntityNotFoundException" on the orphaned reload.
db.initialPoolSize=10
db.minPoolSize=10
db.maxPoolSize=50
